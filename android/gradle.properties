# ─────────────────────────────────────────────────────────────────────────────
# Increase JVM heap memory for the Gradle build process
# OutOfMemoryError during D8/dex merging = not enough memory allocated
# ─────────────────────────────────────────────────────────────────────────────

# Give Gradle daemon 4GB of heap (default is usually 512MB–1GB)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable Gradle daemon (faster builds)
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Android specific
android.useAndroidX=true
kotlin.code.style=official
