# ─────────────────────────────────────────────────────────────────────────────
# SERVER CONFIG
# ─────────────────────────────────────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE — using H2 in-memory database for development
# No setup needed! Data is stored in RAM while the server runs.
# For production, swap this with PostgreSQL or MySQL config below.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — open http://localhost:8080/h2-console to view your database
spring.h2.console.enabled=true

# JPA/Hibernate — auto-creates tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# App name
spring.application.name=kotlin-fullstack-server

# ─────────────────────────────────────────────────────────────────────────────
# FOR PRODUCTION — swap H2 with PostgreSQL:
# ─────────────────────────────────────────────────────────────────────────────
# spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.hibernate.ddl-auto=update
