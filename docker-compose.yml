version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
# Starts TWO containers:
#   1. postgres  — the database
#   2. server    — the Spring Boot app (waits for postgres to be ready)
#
# Run with:  docker-compose up --build
# Stop with: docker-compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine          # lightweight postgres image
    container_name: kotlin_db
    environment:
      POSTGRES_DB: kotlinapp           # database name
      POSTGRES_USER: postgres          # username
      POSTGRES_PASSWORD: password      # password (change in production!)
    ports:
      - "5432:5432"                    # expose to host so you can connect with DBeaver etc.
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Spring Boot Server ─────────────────────────────────────────────────────
  server:
    build:
      context: .                       # uses the Dockerfile in this folder
      dockerfile: Dockerfile
    container_name: kotlin_server
    ports:
      - "8080:8080"                    # host:container
    environment:
      # Override application.properties with PostgreSQL settings
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kotlinapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_H2_CONSOLE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy     # wait until postgres is ready
    restart: on-failure

volumes:
  postgres_data:                       # named volume — survives docker-compose down
